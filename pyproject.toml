[project]
name = "fleet-graph"
version = "0.0.1"
description = "LangGraph-based orchestration spine for the ronin fleet and dev-dispatch pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "httpx==0.28.1",
]

[project.scripts]
fleet-graph = "fleet_graph.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_graph"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
