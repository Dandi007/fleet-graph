[project]
name = "fleet-graph"
version = "0.0.1"
description = "LangGraph-based orchestration spine for the ronin fleet and dev-dispatch pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "httpx==0.28.1",
    "fastmcp==3.4.7",
]

[project.scripts]
fleet-graph = "fleet_graph.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_graph"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# dev-dispatch 命名空间是 controller 保留区：ruff（lint/format）不得检视/改写。
extend-exclude = [".dev-dispatch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Docs and comments quote the plan verbatim, and the plan is written in Chinese.
# CJK punctuation is intended here, not a confusable typo for the ASCII form.
allowed-confusables = ["，", "：", "；", "（", "）", "、", "「", "」", "％", "－"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.format]
exclude = ["src/fleet_graph/dd/vendor/*.py"]

[tool.ruff.lint.per-file-ignores]
# Vendored domain code from loop-engine-development-mcp. Kept byte-identical
# apart from the import rewrite so a future diff against upstream stays
# readable; restyling it here would make that diff useless.
"src/fleet_graph/dd/vendor/*.py" = ["ALL"]
