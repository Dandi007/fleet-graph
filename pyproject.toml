[project]
name = "fleet-graph"
version = "2.0.0"
description = "每 Goal 独立 LangGraph 引擎与统一 MCP 控制面"
requires-python = ">=3.11,<3.12"
dependencies = [
    "langgraph==1.2.11",
    "fastmcp==3.4.7",
    "jsonschema==4.26.0",
]

[project.scripts]
fleet-graph = "fleet_graph.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_graph"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["，", "：", "；", "（", "）", "、", "「", "」", "％", "－"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --ignore=tests/e2e/contract/fixture"
