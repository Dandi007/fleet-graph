name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Self-hosted, on the machine that runs the fleet. GitHub Actions minutes
    # for this private repo are blocked on account billing, so hosted runners
    # never started a job -- which meant "CI green" was never actually a gate
    # and every PR merged on the author's own say-so.
    #
    # The runner is deliberately weak: its own unix user (`ghrunner`), no
    # access to ~/.config/fleet-graph/env or any agent-bus token, no deploy
    # rights. It runs lint and tests, nothing else. Never add a secret to this
    # workflow without revisiting that.
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Sync dependencies
        run: uv sync
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest
